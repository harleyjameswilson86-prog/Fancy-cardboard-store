<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/harleyjameswilson86-prog/Fancy-cardboard-store/main/favicon.png"">
<title>Pokémon TCG - Fancy Cardboard Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="main-header">
<div class="header-left">
<span class="hamburger" onclick="toggleMenu()">☰</span>
<a href="index.html"><img src="logo.png" alt="Fancy Cardboard" style="height:70px;margin-left:0px;margin-top:8px;"/></a>
</div>
<div class="header-right">
<a href="#" class="search-icon" onclick="toggleSearch(event)"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></a>
<a href="cart.html" class="cart-icon">
  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
  <span id="cart-count" style="display:none;">0</span>
</a>
</div>
<div class="search-dropdown" id="searchDropdown">
<input type="text" id="search-input" placeholder="Search products..." onkeyup="searchProducts()" style="width:100%;padding:12px 20px;border:2px solid #000;border-radius:50px;font-size:1rem;box-sizing:border-box;">
<div id="search-results"></div>
</div>
</header>
<nav class="mobile-nav">
<a href="index.html">Home</a>


</nav>
<main class="shop">
<h1>Pokémon TCG</h1>
<p class="subtitle">Authentic Pokémon trading cards</p>
<div id="pokemon-products" class="products"></div>
</main>
<script>
let inventory = [];

fetch('backend/inventory.json')
  .then(r => r.json())
  .then(data => {
    inventory = data;
    const pokemonCards = inventory.filter(i => i.category === 'Pokemon');
    const container = document.getElementById('pokemon-products');
    pokemonCards.forEach(card => {
      const cardEl = document.createElement('div');
      cardEl.className = 'product-card';
      cardEl.innerHTML = `
        <a href="product.html?id=${card.id}">
          <div class="product-image">
            <img src="${card.image}" alt="${card.name}">
          </div>
          <div class="product-name">${card.name}</div>
          <div class="product-price" style="color:#FF6600 !important;">$${card.price.toFixed(2)}</div>
        </a>
        <button class="btn" onclick="addToCart('${card.name}', ${card.price})">Add to Cart</button>
      `;
      container.appendChild(cardEl);
    });
  });

function addToCart(name, price) {
  let cart = JSON.parse(localStorage.getItem('cart') || '[]');
  cart.push({name, price, quantity: 1});
  localStorage.setItem('cart', JSON.stringify(cart));
  alert(name + ' added to cart!');
}
</script>
</body>
</html>
