<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Piece - Fancy Cardboard Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="main-header">
<div class="header-left">
<span class="hamburger" onclick="toggleMenu()">☰</span>
<a href="index.html" class="logo">FANCY CARDBOARD STORE</a>
</div>
<div class="header-right">
<a href="cart.html" class="cart-icon">🛒<span id="cart-count">0</span></a>
</div>
</header>
<nav class="mobile-nav">
<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
<a href="shop-pokemon.html">Pokémon TCG</a>
<a href="shop-onepiece.html">One Piece</a>
</nav>
<main class="shop">
<h1>One Piece</h1>
<p class="subtitle">Authentic One Piece trading cards</p>
<div id="onepiece-products" class="products"></div>
</main>
<script>
let inventory = [];
const productStock = {};

fetch('backend/inventory.json')
  .then(r => r.json())
  .then(data => {
    inventory = data;
    const opCards = inventory.filter(i => i.category === 'One Piece');
    const container = document.getElementById('onepiece-products');
    opCards.forEach(card => {
      const shipping = card.shipping || 0;
      const cardEl = document.createElement('div');
      cardEl.className = 'product-card';
      cardEl.innerHTML = `
        <a href="product.html?id=${card.id}">
          <div class="product-image" style="display:flex;justify-content:center;align-items:center;height:200px;overflow:hidden;">
            <img src="${card.image || 'images/placeholder.jpg'}" alt="${card.name}" style="max-width:100%;max-height:180px;object-fit:contain;">
          </div>
          <div class="product-name">${card.name}</div>
          <div class="product-price">$${card.price.toFixed(2)}</div>
          ${shipping > 0 ? `<div style="font-size:0.8em;color:#666;">+ $${shipping.toFixed(2)} shipping</div>` : ''}
          <div style="font-size:0.8em;">Qty: ${card.quantity || 1}</div>
        </a>
        <button class="btn" onclick="addToCart('${card.name.replace(/'/g, "\\'")}', ${card.price}, ${card.quantity || 1}, ${shipping})">Add to Cart</button>
      `;
      container.appendChild(cardEl);
    });
  });

function addToCart(name, price, maxQty=99, shipping=0) {
  let cart = JSON.parse(localStorage.getItem('cart') || '[]');
  let existing = cart.find(i => i.name === name);
  if (existing) {
    if (existing.quantity < maxQty) {
      existing.quantity++;
    } else {
      alert('Max quantity reached!');
      return;
    }
  } else {
    cart.push({name, price, quantity: 1, shipping});
  }
  localStorage.setItem('cart', JSON.stringify(cart));
  alert(name + ' added to cart!');
  updateCartCount();
}

function updateCartCount() {
  let cart = JSON.parse(localStorage.getItem('cart') || '[]');
  let totalItems = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
  let countEl = document.getElementById('cart-count');
  if (countEl) {
    countEl.textContent = totalItems;
    countEl.style.display = totalItems > 0 ? 'inline' : 'none';
  }
}

updateCartCount();
</script>
</body>
</html>
