<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>Admin - Fancy Cardboard Store</title>
<link rel="stylesheet" href="style.css">
<style>
.admin-page { max-width: 1200px; margin: 2rem auto; padding: 0 5%; }
.admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
.admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.admin-tab { padding: 10px 20px; background: #f0f0f0; border: none; cursor: pointer; border-radius: 5px; }
.admin-tab.active { background: #ff9f1c; color: white; }
.admin-section { display: none; }
.admin-section.active { display: block; }
.product-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
.product-table th, .product-table td { padding: 10px; border: 1px solid #ddd; text-align: left; }
.product-table th { background: #f5f5f5; }
.stock-input { width: 60px; padding: 5px; }
.price-input { width: 80px; padding: 5px; }
.save-btn { background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
.order-item { background: #f9f9f9; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
.order-header { display: flex; justify-content: space-between; font-weight: bold; }
.order-items { margin-top: 10px; }
.order-total { font-size: 1.2rem; font-weight: bold; color: #ff9f1c; margin-top: 10px; }
.add-product-form { background: #f9f9f9; padding: 20px; border-radius: 10px; margin-top: 20px; }
.add-product-form input, .add-product-form textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; }
.add-product-form button { background: #ff9f1c; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>
<header class="main-header">
<div class="header-left">
<span class="hamburger" onclick="toggleMenu()">☰</span>
<a href="index.html" class="logo">FANCY CARDBOARD STORE</a>
</div>
<div class="header-right">
<a href="cart.html" class="cart-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span id="cart-count" style="display:none;">0</span></a>
</div>
</header>
<nav class="mobile-nav" id="mobileNav">
<a href="index.html">Home</a>
<a href="admin.html">Admin</a>
</nav>
<div id="loginScreen" style="max-width:400px;margin:100px auto;padding:20px;text-align:center;">
<h2>Admin Login</h2>
<input type="password" id="adminPassword" placeholder="Enter password" style="width:100%;padding:10px;margin:10px 0;">
<button onclick="checkPassword()" style="padding:10px 20px;background:#27ae60;color:#fff;border:none;cursor:pointer;">Login</button>
</div>

<div id="adminContent" style="display:none;">
<h1>Admin Panel</h1>
<div class="admin-tabs">
<button class="admin-tab active" onclick="showTab('inventory')">Inventory</button>
<button class="admin-tab" onclick="showTab('orders')">Orders</button>
<button class="admin-tab" onclick="showTab('add-product')">Add Product</button>
</div>

<div id="inventory" class="admin-section active">
<h2>Inventory Management</h2>
<table class="product-table">
<thead>
<tr>
<th>Product</th>
<th>Price</th>
<th>Stock</th>
<th>Badge</th>
<th>Action</th>
</tr>
</thead>
<tbody id="inventory-list"></tbody>
</table>
</div>

<div id="orders" class="admin-section">
<h2>Orders</h2>
<div id="orders-list"></div>
</div>

<div id="add-product" class="admin-section">
<h2>Add New Product</h2>
<div class="add-product-form">
<input type="text" id="new-product-id" placeholder="Product ID (e.g., pokemon-charizard)">
<input type="text" id="new-product-name" placeholder="Product Name">
<input type="number" id="new-product-price" placeholder="Price">
<input type="number" id="new-product-stock" placeholder="Stock Quantity">
<input type="text" id="new-product-image" placeholder="Image URL (e.g., images/charizard.jpg)">
<input type="text" id="new-product-category" placeholder="Category (e.g., Pokémon TCG)">
<textarea id="new-product-description" placeholder="Description" rows="3"></textarea>
<textarea id="new-product-details" placeholder="Details (separate with |)" rows="3"></textarea>
<button onclick="addProduct()">Add Product</button>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
</main>

<script>
function checkPassword() {
  var pass = document.getElementById("adminPassword").value;
  if(pass === "admin123") {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("adminContent").style.display = "block";
  } else {
    alert("Incorrect password");
  }
}

function toggleMenu() { document.getElementById('mobileNav').classList.toggle('active'); }

function showTab(tabId) {
  document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  event.target.classList.add('active');
  if (tabId === 'inventory') loadInventory();
  if (tabId === 'orders') loadOrders();
}

async function loadInventory() {
  try {
    const res = await fetch('https://fancy-cardboard-stripe-backend.onrender.com/api/products');
    const products = await res.json();
    const tbody = document.getElementById('inventory-list');
    tbody.innerHTML = products.map(p => `
      <tr>
        <td>${p.name}</td>
        <td>$${p.price.toFixed(2)}</td>
        <td><input type="number" class="stock-input" id="stock-${p.id}" value="${p.stock}" min="0"></td>
        <td>${p.badge}</td>
        <td><button class="save-btn" onclick="updateStock('${p.id}')">Save</button></td>
      </tr>
    `).join('');
  } catch (e) {
    console.error(e);
  }
}

async function updateStock(id) {
  const stock = document.getElementById(`stock-${id}`).value;
  try {
    const res = await fetch(`https://fancy-cardboard-stripe-backend.onrender.com/api/products/${id}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({stock})
    });
    const data = await res.json();
    if (data.success) {
      alert('Stock updated!');
      loadInventory();
    }
  } catch (e) {
    alert('Error updating stock');
  }
}

async function loadOrders() {
  try {
    const res = await fetch('https://fancy-cardboard-stripe-backend.onrender.com/api/orders');
    const orders = await res.json();
    const container = document.getElementById('orders-list');
    if (orders.length === 0) {
      container.innerHTML = '<p>No orders yet.</p>';
      return;
    }
    container.innerHTML = orders.map(o => `
      <div class="order-item">
        <div class="order-header">
          <span>Order #${o.id.substring(0, 8)}</span>
          <span>${new Date(o.date).toLocaleString()}</span>
        </div>
        <div><strong>Customer:</strong> ${o.customer.name}</div>
        <div><strong>Email:</strong> ${o.customer.email}</div>
        <div><strong>Address:</strong> ${o.customer.address}, ${o.customer.suburb}, ${o.customer.state} ${o.customer.postcode}</div>
        <div class="order-items">
          ${o.items.map(i => `<div>${i.name} x${i.quantity} - $${(i.price * i.quantity).toFixed(2)}</div>`).join('')}
        </div>
        <div class="order-total">Total: $${o.total.toFixed(2)}</div>
      </div>
    `).join('');
  } catch (e) {
    console.error(e);
  }
}

async function addProduct() {
  const product = {
    id: document.getElementById('new-product-id').value,
    name: document.getElementById('new-product-name').value,
    price: document.getElementById('new-product-price').value,
    stock: document.getElementById('new-product-stock').value,
    image: document.getElementById('new-product-image').value || 'images/placeholder.png',
    category: document.getElementById('new-product-category').value,
    description: document.getElementById('new-product-description').value,
    details: document.getElementById('new-product-details').value
  };
  
  if (!product.id || !product.name || !product.price) {
    alert('Please fill in ID, Name, and Price');
    return;
  }
  
  try {
    const res = await fetch('https://fancy-cardboard-stripe-backend.onrender.com/api/products', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(product)
    });
    const data = await res.json();
    if (data.success) {
      alert('Product added!');
      // Clear form
      document.querySelectorAll('.add-product-form input, .add-product-form textarea').forEach(i => i.value = '');
    }
  } catch (e) {
    alert('Error adding product');
  }
}

loadInventory();
</script>
</body>
</html>
